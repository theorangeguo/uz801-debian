name: Build UZ801 Debian System Image

on:
  push:
    branches: [ main ]
    tags: [ 'v*' ]
  workflow_dispatch:

permissions:
  contents: write

jobs:
  build:
    runs-on: ubuntu-22.04
    steps:
      - name: Checkout Repository
        uses: actions/checkout@v4

      - name: Install Host Build Dependencies
        run: |
          sudo apt-get update
          sudo apt-get install -y debootstrap qemu-user-static binfmt-support e2fsprogs dosfstools

      - name: Verify Binfmt for AArch64
        run: |
          sudo update-binfmts --enable qemu-aarch64

      - name: Build Debian Bookworm (arm64) Rootfs
        run: |
          sudo bash scripts/01-build-rootfs.sh rootfs

      - name: Pack rootfs-debian.img
        run: |
          sudo bash scripts/02-pack-image.sh rootfs rootfs-debian.img 1200

      - name: Compress System Images
        run: |
          gzip -k -9 rootfs-debian.img
          ls -lh rootfs-debian.img*

      - name: Upload Artifacts
        uses: actions/upload-artifact@v4
        with:
          name: uz801-debian-system-image
          path: |
            rootfs-debian.img.gz

      - name: Create GitHub Release
        if: startsWith(github.ref, 'refs/tags/')
        uses: softprops/action-gh-release@v2
        with:
          files: |
            rootfs-debian.img.gz
          generate_release_notes: false
