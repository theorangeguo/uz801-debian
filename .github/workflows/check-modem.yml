name: Check modem customization
on:
  push:
  pull_request:
  workflow_dispatch:
permissions:
  contents: read
jobs:
  check:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - name: Check shell syntax and line endings
        run: |
          bash -n rootfs/build.sh rootfs/chroot.sh
          sh -n rootfs/overlay/usr/local/sbin/uz801-select-sim
          if grep -Il $'\r' rootfs/build.sh rootfs/chroot.sh rootfs/overlay/usr/local/sbin/uz801-select-sim; then
            echo 'Shell sources must use LF line endings' >&2
            exit 1
          fi
      - name: Check selector safety and asynchronous switching
        run: python3 -m unittest discover -s tests -v
