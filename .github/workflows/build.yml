name: Build UZ801 v3.0 packaged baseline
on:
  repository_dispatch:
  workflow_dispatch:
    inputs:
      arch:
        description: "Target architecture"
        required: true
        default: 'arm64'
        type: choice
        options:
          - arm64

permissions:
  contents: write

jobs:
  build:
    name: Build UZ801 v3.0 packaged baseline
    runs-on: ubuntu-latest
    steps:
      - name: Prepare
        run: |
          sudo apt-get -y update
          sudo apt-get -y install curl wget debootstrap binfmt-support qemu-user-static android-sdk-libsparse-utils

      - name: Checkout
        uses: actions/checkout@v4
        with:
          token: ${{ secrets.GITHUB_TOKEN }}

      - name: Prepare repository
        run: git config --global --add safe.directory "$(pwd)"

      - name: Build
        run: |
          cd rootfs
          sudo ./build.sh "${{ inputs.arch || 'arm64' }}"
          sudo xz rootfs.img

      - name: Upload artifacts
        uses: actions/upload-artifact@v4
        with:
          name: uz801-v3.0-debian
          path: |
            aboot/*.mbn
            kernel/*.img
            rootfs/rootfs.img.xz

      - name: Generate release tag
        id: version
        run: |
          NAME=$(echo "UZ801 v3.0 Debian $(cat rootfs/debian_version)")
          TAG_NAME=uz801-v3.0-debian-$(cat rootfs/debian_version)-${{ github.run_number }}-${{ inputs.arch || 'arm64' }}
          git config user.name "github-actions[bot]"
          git config user.email "github-actions[bot]@users.noreply.github.com"
          git tag $TAG_NAME
          git push origin $TAG_NAME
          echo -e "- Bootloader: $(cat aboot/ver.txt)\n$(cat rootfs/info.md)\n\n$(git log -1 --format=%B)" > release_notes.md
          echo "NAME=$NAME" >> $GITHUB_OUTPUT
          echo "TAG_NAME=$TAG_NAME" >> $GITHUB_OUTPUT

      - name: Releases
        uses: softprops/action-gh-release@v2
        with:
          name: ${{ steps.version.outputs.NAME }}
          body_path: release_notes.md
          tag_name: ${{ steps.version.outputs.TAG_NAME }}
          files: |
            aboot/*.mbn
            kernel/*.img
            rootfs/rootfs.img.xz
